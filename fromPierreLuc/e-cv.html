<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Pierre-Luc Poirier — Curriculum Vitae">

  <title>fromPierreLuc — CV</title>

  <link rel="stylesheet" href="cv-style.css">
</head>

<body>

  <main class="cv-layout">

    <aside class="cv-sidebar">

      <div class="sidebar-content">

  <span class="return-text">Return to</span>

  <a
    href="index.html"
    class="logo-link"
    aria-label="Return to My Space">

    <img
      src="assets/Logo fromPierreLuc.png"
      alt="From PierreLuc"
      class="site-logo">

  </a>

  <button
    class="print-button"
    id="print-cv"
    type="button">
    Print CV
  </button>

</div>

    </aside>

    <section class="cv-document">

      <img
        class="cv-image"
        src="assets/CV/English/CV-English.png"
        alt="Curriculum vitae of Pierre-Luc Poirier">

    </section>

  </main>

  <script>
    const printButton = document.getElementById("print-cv");

    printButton.addEventListener("click", function () {
      window.print();
    });
  </script>

</body>

</html>
